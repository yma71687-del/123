name: Editor quality gate
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked React/TypeScript frontend and build same-origin bundles
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run build:preview
          git diff --exit-code -- preview/NEXUS-FX-STUDIO-0.4.0.zip
          npm run check:format
          npm run test:unit
      - name: Install API and browser test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/playwright install --with-deps chromium
          if ! command -v ffprobe >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: API regressions
        run: .venv/bin/python -m unittest discover -s tests/api -v
      - name: Real browser / WebGL / media regressions under strict script CSP
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: .venv/bin/python -m unittest discover -s tests/e2e -v
      - name: Standalone ZIP with persistent browser storage and disconnected network
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: .venv/bin/python -m unittest discover -s tests/preview -v
      - name: Build isolated API container and verify Nginx integration
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: |
          docker build -t nexus-fx-review-api:0.4.0 backend
          docker build -f Dockerfile.web -t nexus-fx-review-web:0.4.0 .
          .venv/bin/python tests/docker_review.py
      - name: Isolated authenticated online deployment and protection checks
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: .venv/bin/python -m unittest discover -s tests/deployment -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-browser-evidence
          path: .test-results/
          if-no-files-found: ignore
