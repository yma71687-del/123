# Isolated review stack. Does not start the production gate/tunnel or bind 80/443.
services:
  api:
    build: ./backend
    environment:
      DATA_DIR: /data
    volumes:
      - review_data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${NEXUS_REVIEW_PORT:-43123}:80"
    depends_on: [api]
volumes:
  review_data:
