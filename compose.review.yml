# Isolated review stack. Does not start the production gate/tunnel or bind 80/443.
services:
  api:
    build: ./backend
    environment:
      DATA_DIR: /data
    volumes:
      - review_data:/data
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${NEXUS_REVIEW_PORT:-43123}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
volumes:
  review_data:
