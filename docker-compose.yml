services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - nexus_data:/data
    expose:
      - "8000"
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      - api
  gate:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NEXUS_USER: ${NEXUS_USER}
      NEXUS_PASSWORD_HASH: ${NEXUS_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    expose:
      - "80"
    depends_on:
      - web
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gate:80
    depends_on:
      - gate
volumes:
  nexus_data:
  caddy_data:
  caddy_config:
